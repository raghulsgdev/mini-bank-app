<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Bank | Withdraw</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <section>
            <h1 class="hd">Mini <span class="span">Bank</span></h1>
        </section>

        <section class="nav">
            <a class="txt" href="./index.html">Dashboard</a>
            <a class="txt" href="./Deposit.html">Deposit</a>
            <a class="txt" href="#debitSection">Debit</a>
            <a class="txt" href="./register.html">Register</a>
        </section>
    </header>

    <section class="bg_clrr">
        <main id="debitSection">
            <section class="dep_form">
                <h1 class="debit_title">Withdraw Amount</h1>

                <form>
                    <label class="lbl_txt">Account Holder Name</label>
                    <input type="text" id="deb_name" class="inp" placeholder="Enter Your Name">

                    <label class="lbl_txt">Mobile Number</label>
                    <input type="text" id="deb_no" class="inp" placeholder="Enter Mobile Number">

                    <label class="lbl_txt">Account Number</label>
                    <input type="text" id="deb_accno" class="inp" placeholder="Enter Your Account Number">

                    <label class="lbl_txt">Withdrawal Amount</label>
                    <input type="text" id="deb_amt" class="inp" placeholder="Enter Amount">

                    <section class="debit_btn_sec">
                        <button type="submit" class="acc_btn" id="debBtn">Withdraw</button>
                    </section>
                </form>
            </section>
        </main>

        <footer class="footer_section">
            <section class="footer-content">
                <h2 class="hd">Mini <span class="span">Bank</span></h2>
                <p>Secure • Transparent • Trusted Banking</p>
            </section>
            <p class="copy">© 2025 Mini Bank. All Rights Reserved.</p>
        </footer>
    </section>

    <script src="./debit.js"></script>

</body>
</html>
